[project]
name = "latentedge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "mlx>=0.18",
    "click>=8.1",
    "plotext>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latentedge"]

[tool.mypy]
strict = true
