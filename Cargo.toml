[package]
name = "layatrade-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "layatrade_rs"
path = "src/lib.rs"

[[bin]]
name = "layatrade-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
solana-client = "2"
solana-sdk = "2"
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.28"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
wiremock = "0.6"
